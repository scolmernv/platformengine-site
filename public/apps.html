<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apps | Platform Engine</title>
  <meta name="description" content="Apps from Platform Engine.">
  <meta name="theme-color" content="#14181d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7L4 23V9z' fill='%235cc2f2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --base: #14181d;
      --ink: #eaf1f6;
      --muted: #a3b4c2;
      --glow: #5cc2f2;
      --rule: rgba(92, 194, 242, .3);
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background: var(--base);
      color: var(--ink);
      font: 400 1.0625rem/1.6 "Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; }
    body::before {
      z-index: -2;
      background-color: var(--base);
      background-image: url("hex-bg.jpg");
      background-image: image-set(url("hex-bg.webp") type("image/webp"), url("hex-bg.jpg") type("image/jpeg"));
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }
    /* Heavier shade than the home page: this page carries more text */
    body::after {
      z-index: -1;
      background: linear-gradient(90deg, rgba(14,18,23,.92) 0%, rgba(14,18,23,.75) 55%, rgba(14,18,23,.4) 100%);
    }

    .wrap { max-width: 56rem; padding: clamp(1.5rem, 6vw, 5rem); }
    .top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: .75rem 2rem; }
    .sections { display: flex; gap: 1.75rem; }
    .sections a { color: var(--muted); text-decoration: none; font-size: .95rem; padding-bottom: 2px; border-bottom: 1px solid transparent; }
    .sections a:hover { color: var(--ink); }
    .sections a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--glow); }
    .mark {
      color: var(--muted);
      text-decoration: none;
      font-size: .95rem;
    }
    .mark:hover { color: var(--ink); }
    a:focus-visible { outline: 2px solid var(--glow); outline-offset: 4px; }

    h1 {
      margin: clamp(3rem, 12vh, 7rem) 0 2rem;
      font-weight: 300;
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      line-height: 1;
      letter-spacing: -.03em;
    }

    .apps { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--rule); }
    .apps li { border-top: 1px solid var(--rule); }
    .apps a {
      display: block;
      padding: 1.5rem 0;
      color: inherit;
      text-decoration: none;
    }
    .name { display: block; font-size: 1.5rem; font-weight: 400; letter-spacing: -.01em; transition: color .15s; }
    .desc { display: block; max-width: 46ch; margin-top: .25rem; color: var(--muted); }
    .apps a:hover .name, .apps a:focus-visible .name { color: var(--glow); }

    .note { margin: 1.5rem 0 0; color: var(--muted); font-size: .9rem; }

    @media (prefers-reduced-motion: reduce) { .name { transition: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="top" aria-label="Site">
      <a class="mark" href="/">Platform Engine</a>
      <span class="sections">
        <a href="/apps" aria-current="page">Apps</a>
        <a href="/agents">Agents</a>
      </span>
    </nav>
    <main>
      <h1>Apps</h1>
      <ul class="apps">
        <li>
          <a href="https://chat.platformengine.com">
            <span class="name">Chat</span>
            <span class="desc">Talk to NVIDIA Nemotron, running on a DGX Spark. Sign-in required.</span>
          </a>
        </li>
      </ul>
      <p class="note">Apps may be temporarily unavailable during maintenance.</p>
    </main>
  </div>
</body>
</html>
